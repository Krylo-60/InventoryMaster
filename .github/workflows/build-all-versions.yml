name: Build All Minecraft Versions (1.20 - 26.2)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 26.2-fabric
            name: "Fabric & Quilt (26.2)"
          - target: 1.21.11-fabric
            name: "Fabric & Quilt (1.21.11)"
          - target: 1.21.1-fabric
            name: "Fabric & Quilt (1.21.1)"
          - target: 1.21.1-neoforge
            name: "NeoForge & Forge (1.21.1)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod JAR
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload target JAR
        uses: actions/upload-artifact@v4
        with:
          name: InventoryMaster-${{ matrix.target }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
